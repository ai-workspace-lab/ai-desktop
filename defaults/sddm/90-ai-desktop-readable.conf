# AI Desktop: fixed readable SDDM theme, independent of user wallpaper.
[Theme]
Current=ubuntu-budgie-login-zh
ThemeDir=/usr/share/sddm/themes
CursorTheme=Breeze_Light
CursorSize=24

[General]
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/ubuntu-budgie-login-zh/components/,QT_IM_MODULE=qtvirtualkeyboard,LANG=zh_CN.UTF-8,LANGUAGE=zh_CN:en_US,LC_ALL=zh_CN.UTF-8
