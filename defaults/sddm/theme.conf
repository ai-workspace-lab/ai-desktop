[General]
scale = 1.0
enable-animations = false
animated-background-placeholder =
background-fill-mode = "fill"
use-accounts-service-backgrounds = false

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "ai-desktop-dark.svg"
use-background-color = false
background-color = "#20242d"
blur = 0
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "bottom-right"
align = "left"
format = "hh:mm"
font-family = "Noto Sans CJK SC"
font-size = 75
font-weight = 300
color = "#ffffff"

[LockScreen.Date]
display = true
format = "dddd dd MMMM"
locale = "zh_CN"
font-family = "Noto Sans CJK SC"
font-size = 32
font-weight = 300
color = "#ffffff"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = ""
font-family = "Noto Sans CJK SC"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#d3dae3"
paint-icon = true
spacing = 0

[LoginScreen]
background = "ai-desktop-dark.svg"
use-background-color = false
background-color = "#20242d"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "left"
margin = 50
show-all-users = false

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 30
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 3
inactive-border-size = 3
active-border-color = "#5294e2"
inactive-border-color = "#5294e2"

[LoginScreen.LoginArea.Username]
font-family = "Noto Sans CJK SC"
font-size = 20
font-weight = 600
color = "#f5f7fa"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 280
height = 44
display-icon = true
font-family = "Noto Sans CJK SC"
font-size = 16
icon = "password.svg"
icon-size = 16
content-color = "#f5f7fa"
background-color = "#303846"
background-opacity = 1.0
border-size = 2
border-color = "#88b9ef"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#303846"
background-opacity = 1.0
active-background-color = "#356399"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#f5f7fa"
active-content-color = "#ffffff"
border-size = 2
border-color = "#5294e2"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = true
font-family = "Noto Sans CJK SC"
font-size = 15
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Noto Sans CJK SC"
font-weight = 600
font-size = 16
icon-size = 30
icon = "spinner.svg"
color = "#f5f7fa"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Noto Sans CJK SC"
font-size = 14
font-weight = 400
normal-color = "#f5f7fa"
warning-color = "#ffd08a"
error-color = "#ffb4b4"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 100
size = 38
border-radius = 5
spacing = 12
font-family = "Noto Sans CJK SC"

[LoginScreen.MenuArea.Popups]
max-height = 380
item-height = 38
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#293240"
background-opacity = 1.0
active-option-background-color = "#405b78"
active-option-background-opacity = 1.0
content-color = "#f5f7fa"
active-content-color = "#ffffff"
font-family = "Noto Sans CJK SC"
border-size = 2
border-color = "#5294e2"
font-size = 14
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 4
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 280
popup-width = 320
background-color = "#293240"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#f5f7fa"
active-content-color = "#ffffff"
border-size = 0
font-size = 14
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-left"
index = 3
popup-direction = "up"
popup-align = "center"
popup-width = 320
display-layout-name = true
background-color = "#293240"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#f5f7fa"
active-content-color = "#ffffff"
border-size = 0
font-size = 14
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-left"
index = 2
background-color = "#293240"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#f5f7fa"
active-content-color = "#ffffff"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-left"
index = 1
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#293240"
background-opacity = 1.0
active-background-opacity = 1.0
content-color = "#f5f7fa"
active-content-color = "#ffffff"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#383c4a"
background-opacity = 1.0
key-content-color = "#d3dae3"
key-color = "#404552"
key-opacity = 1.0
key-active-background-color = "#5294e2"
key-active-opacity = 0.0
selection-background-color = "#5294e2"
selection-content-color = "#ffffff"
primary-color = "#5294e2"
border-size = 2
border-color = "#5294e2"

[Tooltips]
enable = true
font-family = "Noto Sans CJK SC"
font-size = 14
content-color = "#f5f7fa"
background-color = "#383c4a"
background-opacity = 1.0
border-radius = 5
disable-user = false
disable-login-button = false
