name: task-ai-desktop
version: 0.1.0
target:
  os: ubuntu
  release: "26.04"
  session: icewm
  display: x11
repositories:
  xdock: git@github.com:ai-workspace-lab/XDock.git
  xlaunch: git@github.com:ai-workspace-lab/XLaunch.git
profiles:
  desktop:
    display_server: existing-xorg
    display_manager: sddm
    session: icewm
    remote_access: optional
  vps:
    display_server: xvfb
    remote_access: [x11vnc, novnc, websockify]
  container:
    display_server: xvfb
    remote_access: [x11vnc, novnc, websockify]
    init: tini
    service_manager: dbus-run-session
future:
  wayland:
    display_server: weston-or-wlroots-headless
    rendering: software
    x11_compatibility: xwayland
defaults:
  icewm_menu: xlaunch-first
  xlaunch_menu_anchor: lower-left-above-dock
  xlaunch_compact_size: 760x540
  xlaunch_fullscreen_shortcuts: [Enter, F11, "全部应用"]
  xdock_animation: disabled
  xdock_geometry: static-78px
  icewm_window_effects: low-cpu
  native_window_keys:
    minimize: Alt+F9
    maximize: Alt+F10
components:
  window_manager: icewm
  dock: xdock
  launcher: xlaunch
  terminal: xfce4-terminal
  file_manager: thunar
  browser: [chromium, firefox-esr]
