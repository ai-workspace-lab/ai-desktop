name: task-ai-desktop
version: 0.2.0
target:
  os: ubuntu
  release: "26.04"
  session: icewm
  display: x11
repositories:
  xdock: git@github.com:ai-workspace-lab/XDock.git
  xlaunch: git@github.com:ai-workspace-lab/XLaunch.git
profiles:
  desktop:
    package: task-ai-desktop
    display_server: existing-xorg
    remote_access: optional
  vps:
    package: task-ai-desktop-vps
    display_server: xvfb
    remote_access: [x11vnc, novnc, websockify, xrdp, xpra]
  container:
    package: task-ai-desktop-container
    display_server: xvfb
    remote_access: [x11vnc, novnc, websockify]
    init: tini
    service_manager: dbus-run-session
packages:
  core: task-ai-desktop-core
  session: task-ai-desktop-session
  xdock: task-ai-desktop-xdock
  xlaunch: task-ai-desktop-xlaunch
  apps: task-ai-desktop-apps
  development: task-ai-desktop-dev
future:
  wayland:
    display_server: weston-or-wlroots-headless
    rendering: software
    x11_compatibility: xwayland
components:
  window_manager: icewm
  dock: xdock
  launcher: xlaunch
  terminal: xfce4-terminal
  file_manager: thunar
  browser: [chromium, firefox-esr]
